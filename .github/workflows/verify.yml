name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      # CI-only fake values so Next.js can parse configuration. Not credentials.
      # URL must stay the approved Labs project so the runtime guard is not weakened.
      NEXT_PUBLIC_SUPABASE_URL: https://csaefdkpwukshtouyixg.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-fake-labs-publishable-key-not-a-secret
      SUPABASE_SECRET_KEY: ci-fake-labs-service-role-key-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

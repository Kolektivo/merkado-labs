name: Property pipeline (Labs)

# HOLD (2026-07-27 Product Lead): Labs fully on hold — no paid OpenAI / scrape spend.
# Workflow is also disabled in GitHub Actions UI. Resume requires:
# 1) Product Lead approval
# 2) Restore OPENAI_API_KEY on the `labs` environment
# 3) Set repository variable LABS_OPERATIONS_ENABLED=true
# 4) Re-enable this workflow
# 5) Restore the daily schedule block below if automation is wanted again
on:
  workflow_dispatch:
    inputs:
      trigger_type:
        description: Pipeline trigger provenance (scheduled vs manual/local/dry_run)
        required: true
        type: choice
        options:
          - manual
          - dry_run
          - local
          - scheduled
        default: manual
      pipeline_run_id:
        description: Existing queued pipeline run ID
        required: false
        type: string
      source_keys:
        description: Comma-separated ready source keys (blank runs all Ready sources in order)
        required: false
        type: string
      dry_run:
        description: Scrape and validate without writes or paid AI
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: merkado-property-pipeline-labs
  cancel-in-progress: false

jobs:
  run:
    name: Run Labs property pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: labs
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: csaefdkpwukshtouyixg
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ENRICHMENT_MODEL: "gpt-5.6-terra"
      PROPERTY_AI_DAILY_BUDGET_USD: "2.00"
      PROPERTY_AI_MONTHLY_BUDGET_USD: "25.00"
      MAX_LISTINGS_PER_DAILY_RUN: "25"
      PROPERTY_AI_MAX_LISTINGS_PER_DAILY_RUN: "25"
      LABS_OPERATIONS_ENABLED: ${{ vars.LABS_OPERATIONS_ENABLED }}
    steps:
      - name: Refuse runs while Labs is on hold
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LABS_OPERATIONS_ENABLED:-false}" != "true" ]]; then
            echo "Merkado Labs is on hold (LABS_OPERATIONS_ENABLED!=true)." >&2
            echo "Refusing pipeline runs so OpenAI / Actions spend stays on merkado-cw only." >&2
            echo "See docs/12-deployment-runbook.md to resume." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Guard Labs project identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SUPABASE_PROJECT_REF}" != "csaefdkpwukshtouyixg" ]]; then
            echo "Refusing non-Labs project ref" >&2
            exit 1
          fi
          if [[ "${SUPABASE_URL}" == *"jkrfyvukhhsapoivntms"* ]]; then
            echo "Production Supabase URL is forbidden" >&2
            exit 1
          fi
          if [[ "${SUPABASE_URL}" != *"csaefdkpwukshtouyixg"* ]]; then
            echo "Supabase URL must target Labs project" >&2
            exit 1
          fi

      - name: Run requested sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            trigger="scheduled"
            dry="false"
          else
            trigger="${{ inputs.trigger_type }}"
            dry="${{ inputs.dry_run }}"
          fi
          if [[ "${dry}" == "true" ]]; then
            trigger="dry_run"
          fi
          args=(--once --execute-live --trigger-type "${trigger}")
          if [[ "${{ github.event_name }}" != "schedule" && -n "${{ inputs.pipeline_run_id }}" ]]; then
            args+=(--pipeline-run-id "${{ inputs.pipeline_run_id }}")
          fi
          if [[ "${{ github.event_name }}" != "schedule" && -n "${{ inputs.source_keys }}" ]]; then
            args+=(--source-keys "${{ inputs.source_keys }}")
          fi
          if [[ "${dry}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/run_property_pipeline.py "${args[@]}"

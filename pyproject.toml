[project]
name = "merkado-labs"
version = "0.1.0"
description = "Experimental data and market-intelligence workspace for Curaçao."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "certifi",
    "httpx",
    "openai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "supabase",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
geo = [
    "shapely>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
